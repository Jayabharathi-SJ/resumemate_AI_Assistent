<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeMate AI Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>ResumeMate AI Assistant</h1>
            <p>Your smart assistant for resume building & career preparation</p>
        </header>

        <main class="chat-box">
            <div id="messages" class="messages">
                <div class="message bot">
                    Hi! I'm ResumeMate AI Assistant. How can I help with your resume today?
                </div>
            </div>

            <div class="input-area">
                <input id="messageInput" type="text"
                       placeholder="Ask about your resume..." autocomplete="off">
                <button onclick="sendMessage()">Send</button>
            </div>
        </main>
    </div>

    <script>
        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");

        input.addEventListener("keydown", function(e) {
            if (e.key === "Enter") sendMessage();
        });

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message})
                });

                const data = await response.json();
                addMessage(data.reply, "bot");
            } catch (error) {
                addMessage("Something went wrong. Please try again.", "bot");
            }
        }

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
